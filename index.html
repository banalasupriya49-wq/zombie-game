<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zombie vs Home</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="hud">
      <div class="title">Zombie vs Home</div>
      <div class="stats">
        <span>Health: <strong id="healthValue">100</strong></span>
        <span>Score: <strong id="scoreValue">0</strong></span>
        <span>Wave: <strong id="waveValue">1</strong></span>
      </div>
    </div>

    <canvas id="gameCanvas" width="960" height="600"></canvas>

    <div id="gameOver" class="hidden">
      <h2>Home breached!</h2>
      <p>Survive longer and defend the neighborhood.</p>
      <button id="restartButton">Restart</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
