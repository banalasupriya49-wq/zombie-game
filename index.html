<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zombie vs Home</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="hud">
      <div class="title">Zombie vs Home</div>
      <div class="stats">
        <span>Health: <strong id="healthValue">100</strong></span>
        <span>Home: <strong id="homeValue">100</strong></span>
        <span>Score: <strong id="scoreValue">0</strong></span>
        <span>Wave: <strong id="waveValue">1</strong></span>
      </div>
    </div>

    <canvas id="gameCanvas" width="960" height="600"></canvas>

    <div id="startScreen" class="overlay visible">
      <div class="panel">
        <h1>Defend the Home</h1>
        <p>WASD to move, mouse to aim, left click to shoot.</p>
        <p>Stop the zombie swarm before they reach your base.</p>
        <button id="startButton">Start Defense</button>
      </div>
    </div>

    <div id="gameOver" class="overlay hidden">
      <div class="panel">
        <h2>Home breached!</h2>
        <p>The zombies took over the neighborhood.</p>
        <button id="restartButton">Restart</button>
      </div>
    </div>

    <script src="src/main.js"></script>
  </body>
</html>
